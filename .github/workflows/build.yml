name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r engine/requirements.txt
      - name: Validate project JSONs
        run: python -c "import json,glob; [json.load(open(f,encoding='utf-8')) for f in glob.glob('engine/projects/*/*.json')]; print('json ok')"
      - name: Demo run tel_300ohm
        run: python -u -m engine run --project tel_300ohm --demo --auto-confirm --labels CI_DUT --out /tmp/itc_tel
      - name: Demo run rf_50ohm
        run: python -u -m engine run --project rf_50ohm --demo --auto-confirm --labels CI_C1 --out /tmp/itc_rf

  wpf-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine deps
        run: pip install -r engine/requirements.txt
      - name: Smoke - CLI from repo root (mirrors EngineRoot semantics)
        run: python -u -m engine list_projects
      - name: Restore & Build
        run: dotnet build Console.WPF/IntegratedTestConsole.sln -c Release
      - name: Assert WPF item types (ico=Resource, xaml=Page)
        shell: pwsh
        run: |
          $json = dotnet msbuild Console.WPF/Console.WPF/Console.WPF.csproj -getItem:Resource -getItem:Page -nologo | Out-String | ConvertFrom-Json
          $res = @($json.Items.Resource | ForEach-Object { $_.Identity })
          $pages = @($json.Items.Page | ForEach-Object { $_.Identity })
          Write-Host "Resource:"; $res | ForEach-Object { Write-Host "  $_" }
          Write-Host "Page:"; $pages | ForEach-Object { Write-Host "  $_" }
          foreach ($need in @("app.ico")) {
            if (!($res -like "*$need")) { throw "缺 Resource: $need（XAML 引用会在启动报找不到资源）" }
          }
          foreach ($need in @("Themes\Light.xaml", "Themes\Dark.xaml", "MainWindow.xaml")) {
            if (!($pages -like "*$need")) { throw "缺 Page: $need" }
          }
          Write-Host "resources ok"
      - name: Publish (framework-dependent, 最小体积)
        run: dotnet publish Console.WPF/Console.WPF/Console.WPF.csproj -c Release -o publish
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/* dist/ -Recurse
          Copy-Item engine dist/engine -Recurse
          Copy-Item Console.WPF/Console.WPF/Themes dist/Themes -Recurse
          Copy-Item README_WINDOWS.md dist/
          Copy-Item HELP.html dist/
          Copy-Item update_manifest.example.json dist/
          Copy-Item packages dist/ -Recurse
          Copy-Item configs dist/ -Recurse -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: IntegratedTestConsole-win64
          path: dist/
      - name: Read version from csproj (installer 单一来源)
        id: ver
        shell: pwsh
        run: |
          [xml]$xml = Get-Content Console.WPF/Console.WPF/Console.WPF.csproj
          $v = $xml.Project.PropertyGroup.Version
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"
      - name: Code sign exe (optional, needs CODE_SIGN_PFX secret)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.CODE_SIGN_PFX }}
          CERT_PWD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_B64)) {
            Write-Host "未配置签名证书，跳过（SmartScreen 会提示未知发布者，见 README）"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:CERT_PWD `
            /tr http://timestamp.digicert.com /td SHA256 `
            dist/Console.WPF.exe
          Remove-Item $pfx -Force
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Fetch ChineseSimplified.isl (choco 包缺失中文语言文件)
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" `
            -OutFile "installer/ChineseSimplified.isl"
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ steps.ver.outputs.version }}" installer/setup.iss
      - name: Code sign installer (optional, needs CODE_SIGN_PFX secret)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.CODE_SIGN_PFX }}
          CERT_PWD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_B64)) { Write-Host "未配置签名证书，跳过"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          $setup = Get-ChildItem installer-out/*.exe | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:CERT_PWD `
            /tr http://timestamp.digicert.com /td SHA256 $setup
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IntegratedTestConsole-Setup
          path: installer-out/
